<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="h-titanium-grad" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="h-lime-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FFA8" />
      <stop offset="100%" stop-color="#D7FF3F" />
    </linearGradient>
    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D7FF3F" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ZV Symbol Monogram -->
  <g transform="translate(4, 0)">
    <!-- Right V Arm -->
    <polygon points="44,56 60,86 86,26 72,26 58,64 48,46" fill="url(#h-lime-grad)" filter="url(#h-glow)" />
    <!-- Left Z Monogram -->
    <polygon points="14,26 58,26 68,38 38,38 52,66 52,78 14,78 24,66 38,66 24,38 14,38" fill="url(#h-titanium-grad)" />
  </g>

  <!-- Wordmark 'ZYVRO' (Beveled Geometric Titanium Sans) -->
  <g id="wordmark-zyvro" fill="url(#h-titanium-grad)">
    <!-- Z -->
    <path d="M120,32 L152,32 L152,38 L131,54 L152,54 L152,60 L120,60 L120,54 L141,38 L120,38 Z" />
    <!-- Y -->
    <path d="M158,32 L168,32 L175,44 L182,32 L192,32 L180,50 L180,60 L170,60 L170,50 Z" />
    <!-- V -->
    <path d="M198,32 L209,32 L218,52 L227,32 L238,32 L224,60 L212,60 Z" />
    <!-- R -->
    <path d="M244,32 L266,32 C273,32 278,36 278,42 C278,47 274,50 268,51 L278,60 L267,60 L258,52 L254,52 L254,60 L244,60 Z M254,46 L264,46 C267,46 268,44 268,42 C268,40 267,38 264,38 L254,38 Z" />
    <!-- O -->
    <path d="M284,46 C284,37 291,32 300,32 C309,32 316,37 316,46 C316,55 309,60 300,60 C291,60 284,55 284,46 Z M294,46 C294,51 297,54 300,54 C303,54 306,51 306,46 C306,41 303,38 300,38 C297,38 294,41 294,46 Z" />
  </g>

  <!-- Subtitle '— L A B S —' in Toxic Lime -->
  <g fill="#D7FF3F" filter="url(#h-glow)">
    <!-- Left Dash Line -->
    <rect x="120" y="75" width="28" height="2" />
    <!-- 'L A B S' Letters -->
    <text x="218" y="79" font-family="'JetBrains Mono', 'Chakra Petch', monospace" font-size="13" font-weight="800" letter-spacing="10" text-anchor="middle">LABS</text>
    <!-- Right Dash Line -->
    <rect x="288" y="75" width="28" height="2" />
  </g>
</svg>
