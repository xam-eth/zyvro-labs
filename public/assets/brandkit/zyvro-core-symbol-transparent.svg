<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- THE CORE - Transparent Master Vector (ZYVRO LABS) -->
  <defs>
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D4D4D0" />
      <stop offset="100%" stop-color="#8E8E89" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- North Vector -->
  <polygon points="250,25 325,145 250,200 175,145" fill="url(#titaniumGrad)" />
  <polygon points="250,25 325,145 250,165" fill="#FFFFFF" opacity="0.3" />

  <!-- South Vector -->
  <polygon points="250,475 175,355 250,300 325,355" fill="url(#titaniumGrad)" />
  <polygon points="250,475 175,355 250,335" fill="#6E6E69" opacity="0.4" />

  <!-- West Vector -->
  <polygon points="25,250 145,175 200,250 145,325" fill="url(#titaniumGrad)" />
  <polygon points="25,250 145,175 165,250" fill="#FFFFFF" opacity="0.2" />

  <!-- East Vector -->
  <polygon points="475,250 355,325 300,250 355,175" fill="url(#titaniumGrad)" />
  <polygon points="475,250 355,325 335,250" fill="#6E6E69" opacity="0.4" />

  <!-- Central Luminous Toxic Lime Quantum Core Diamond -->
  <polygon points="250,195 305,250 250,305 195,250" fill="#D7FF3F" filter="url(#neonGlow)" />
  <polygon points="250,225 275,250 250,275 225,250" fill="#FFFFFF" opacity="0.9" />
</svg>
