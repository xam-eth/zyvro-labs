<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="v-titanium-grad" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="v-lime-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FFA8" />
      <stop offset="100%" stop-color="#D7FF3F" />
    </linearGradient>
    <filter id="v-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#D7FF3F" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Large ZV Symbol Centered -->
  <g transform="translate(40, 15)">
    <!-- Right V Arm -->
    <polygon points="52,66 72,102 104,30 86,30 70,76 58,54" fill="url(#v-lime-grad)" filter="url(#v-glow)" />
    <!-- Left Z Monogram -->
    <polygon points="16,30 70,30 82,44 46,44 62,78 62,92 16,92 28,78 46,78 28,44 16,44" fill="url(#v-titanium-grad)" />
  </g>

  <!-- Wordmark 'ZYVRO' Centered -->
  <g id="v-wordmark-zyvro" fill="url(#v-titanium-grad)" transform="translate(-8, 90)">
    <path d="M30,50 L56,50 L56,55 L38,68 L56,68 L56,73 L30,73 L30,68 L48,55 L30,55 Z" />
    <path d="M62,50 L71,50 L78,61 L85,50 L94,50 L83,65 L83,73 L73,73 L73,65 Z" />
    <path d="M99,50 L109,50 L117,67 L125,50 L135,50 L123,73 L111,73 Z" />
    <path d="M140,50 L158,50 C165,50 169,53 169,58 C169,63 165,65 160,66 L169,73 L159,73 L151,67 L148,67 L148,73 L140,73 Z M148,62 L157,62 C159,62 160,61 160,59 C160,57 159,56 157,56 L148,56 Z" />
    <path d="M174,61 C174,54 180,50 188,50 C196,50 202,54 202,61 C202,68 196,73 188,73 C180,73 174,68 174,61 Z M182,61 C182,65 185,67 188,67 C191,67 194,65 194,61 C194,57 191,55 188,55 C185,55 182,57 182,61 Z" />
  </g>

  <!-- Subtitle '— L A B S —' in Toxic Lime -->
  <g fill="#D7FF3F" filter="url(#v-glow)">
    <rect x="24" y="188" width="24" height="2" />
    <text x="100" y="192" font-family="'JetBrains Mono', 'Chakra Petch', monospace" font-size="12" font-weight="800" letter-spacing="8" text-anchor="middle">LABS</text>
    <rect x="152" y="188" width="24" height="2" />
  </g>

  <!-- Tagline 'PLAY BEYOND LIMITS' -->
  <text x="100" y="218" fill="#A0A0A0" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" letter-spacing="4" text-anchor="middle">PLAY BEYOND LIMITS</text>
</svg>
